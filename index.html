<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NÓS PARA SEMPRE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* PRIMEIRA ETAPA */

        #hunt {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #target {
            position: absolute;
            width: 38px;
            height: 38px;
            background: red;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: left 0.1s, top 0.1s;
        }

        /* SEGUNDA ETAPA */

        #flash {
            display: none;
        }

        .symbol {
            width: 65px;
            height: 65px;
            background: red;
        }

        .square {
            border-radius: 0;
            clip-path: none;
            transform: none;
        }

        .circle {
            border-radius: 50%;
            clip-path: none;
            transform: none;
        }

        .diamond {
            border-radius: 0;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            transform: none;
        }

        .triangle {
            border-radius: 0;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            transform: none;
        }

        /* TERCEIRA ETAPA */

        #puzzle {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        .shapes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .shape-button {
            width: 65px;
            height: 65px;
            background: red;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }

        .shape-button:hover {
            filter: brightness(1.3);
        }

        #insert {
            width: 280px;
            max-width: 85vw;
            height: 45px;
            background: white;
            color: black;
            border: none;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        #insert:hover {
            background: #ccc;
        }

        #error {
            display: none;
            color: red;
            font-weight: bold;
            letter-spacing: 3px;
            font-size: 17px;
        }

        /* RESULTADO FINAL */

        #success {
            display: none;
            text-align: center;
            padding: 20px;
        }

        #success p {
            font-size: 21px;
            letter-spacing: 2px;
            overflow-wrap: anywhere;
        }

        /* CELULARES */

        @media (max-width: 450px) {
            .shapes {
                gap: 15px;
            }

            .shape-button {
                width: 55px;
                height: 55px;
            }

            .symbol {
                width: 55px;
                height: 55px;
            }

            #success p {
                font-size: 17px;
            }
        }

    </style>
</head>

<body>

    <!-- PRIMEIRA ETAPA: CÍRCULO VERMELHO -->

    <div class="screen" id="hunt">

        <button id="target" aria-label="Círculo vermelho"></button>

    </div>


    <!-- SEGUNDA ETAPA: SEQUÊNCIA PISCANDO -->

    <div class="screen" id="flash">

        <div id="flashSymbol" class="symbol"></div>

    </div>


    <!-- TERCEIRA ETAPA: SEQUÊNCIA INTERATIVA -->

    <div class="screen" id="puzzle">

        <div class="shapes">

            <button class="shape-button square" aria-label="Forma 1"></button>
            <button class="shape-button square" aria-label="Forma 2"></button>
            <button class="shape-button square" aria-label="Forma 3"></button>
            <button class="shape-button square" aria-label="Forma 4"></button>

        </div>

        <button id="insert" onclick="verificar()">
            INSERIR
        </button>

        <p id="error">ACESSO NEGADO</p>

    </div>


    <!-- QUARTA ETAPA: MENSAGEM FINAL -->

    <div class="screen" id="success">

        <p>seumês+meumêsseumêsmeumês</p>

    </div>


    <script>

        /* PRIMEIRA ETAPA */

        const hunt = document.getElementById("hunt");
        const target = document.getElementById("target");

        let clicks = 0;

        function randomPosition() {

            const margin = 35;

            const maxX = window.innerWidth - margin - 38;
            const maxY = window.innerHeight - margin - 38;

            const minY = 35;

            const x = Math.random() * (maxX - margin) + margin;
            const y = Math.random() * (maxY - minY) + minY;

            target.style.left = x + "px";
            target.style.top = y + "px";
        }

        randomPosition();

        target.addEventListener("click", async function() {

            clicks++;

            if (clicks < 10) {

                randomPosition();

            } else {

                target.style.display = "none";

                await mostrarSequencia();

            }

        });


        /* SEGUNDA ETAPA */

        const flash = document.getElementById("flash");
        const flashSymbol = document.getElementById("flashSymbol");
        const puzzle = document.getElementById("puzzle");

        const sequencia = [
            "square",
            "circle",
            "diamond",
            "square"
        ];

        function esperar(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function mostrarSequencia() {

            hunt.style.display = "none";
            flash.style.display = "flex";

            for (const forma of sequencia) {

                flashSymbol.className = "symbol " + forma;

                await esperar(300);

                flashSymbol.className = "symbol";
                flashSymbol.style.visibility = "hidden";

                await esperar(50);

                flashSymbol.style.visibility = "visible";

            }

            flash.style.display = "none";
            puzzle.style.display = "flex";

        }


        /* TERCEIRA ETAPA */

        const formas = document.querySelectorAll(".shape-button");

        const ciclos = [
            "square",
            "circle",
            "diamond",
            "triangle"
        ];

        formas.forEach(function(botao) {

            botao.dataset.estado = "0";

            botao.addEventListener("click", function() {

                let estado = Number(botao.dataset.estado);

                estado = (estado + 1) % 4;

                botao.dataset.estado = estado;

                botao.className = "shape-button " + ciclos[estado];

            });

        });


        /* VERIFICAÇÃO */

        let bloqueado = false;

        function verificar() {

            if (bloqueado) return;

            const respostas = Array.from(formas).map(
                botao => botao.dataset.estado
            );

            const correta = [
                "0",
                "1",
                "2",
                "0"
            ];

            const acertou = respostas.every(
                (resposta, index) => resposta === correta[index]
            );

            if (acertou) {

                puzzle.style.display = "none";

                document.getElementById("success").style.display = "flex";

            } else {

                bloqueado = true;

                document.getElementById("error").style.display = "block";

                formas.forEach(botao => botao.disabled = true);

                document.getElementById("insert").disabled = true;

            }

        }

    </script>

</body>
</html>
